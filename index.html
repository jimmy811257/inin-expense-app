<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>每日開銷</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f7;
      color: #111;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 36px;
    }

    .date {
      margin-bottom: 24px;
      font-size: 17px;
      color: #666;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 7px 0;
      font-size: 18px;
      border-radius: 13px;
      border: 1px solid #ccc;
    }

    button {
      background: black;
      color: white;
      border: none;
      font-weight: bold;
    }

    .summary {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #ddd;
      font-size: 18px;
      line-height: 1.9;
    }

    .summary strong {
      font-size: 21px;
    }

    h2 {
      margin-top: 30px;
      font-size: 23px;
    }

    .expense {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .expense-info {
      flex: 1;
    }

    .expense-item {
      font-size: 18px;
      font-weight: 600;
    }

    .expense-date {
      margin-top: 4px;
      color: #777;
      font-size: 14px;
    }

    .expense-right {
      text-align: right;
    }

    .expense-amount {
      font-size: 18px;
      font-weight: 600;
    }

    .delete {
      width: auto;
      margin-top: 6px;
      padding: 6px 10px;
      background: #eee;
      color: #333;
      font-size: 14px;
      border-radius: 8px;
    }

    .empty {
      color: #888;
      padding: 14px 0;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>每日開銷</h1>

  <div class="date" id="todayDate"></div>

  <select id="item">
    <option>煙錢</option>
    <option>便當</option>
    <option>加油</option>
    <option>狗糧</option>
    <option>其他</option>
  </select>

  <input
    id="amount"
    type="number"
    inputmode="numeric"
    placeholder="輸入金額"
  >

  <button onclick="saveExpense()">新增支出</button>

  <div class="summary">
    今日支出：
    <strong>NT$ <span id="todayTotal">0</span></strong>
    <br>

    本月累計：
    <strong>NT$ <span id="monthTotal">0</span></strong>
    <br>

    平均每日：
    <strong>NT$ <span id="dailyAverage">0</span></strong>
    <br>

    剩餘預算：
    <strong>NT$ <span id="remaining">6000</span></strong>
  </div>

  <h2>本月明細</h2>

  <div id="expenseList"></div>

</div>

<script>
  let expenses =
    JSON.parse(localStorage.getItem("expenses")) || [];

  function formatLocalDate(date) {
    return (
      date.getFullYear() +
      "/" +
      (date.getMonth() + 1) +
      "/" +
      date.getDate()
    );
  }

  function saveExpense() {
    const item =
      document.getElementById("item").value;

    const amount =
      Number(document.getElementById("amount").value);

    if (!amount || amount <= 0) {
      alert("請輸入正確金額");
      return;
    }

    expenses.push({
      item: item,
      amount: amount,
      date: new Date().toISOString()
    });

    localStorage.setItem(
      "expenses",
      JSON.stringify(expenses)
    );

    document.getElementById("amount").value = "";

    updateApp();
  }

  function deleteExpense(index) {
    const ok = confirm("確定刪除這筆支出？");

    if (!ok) return;

    expenses.splice(index, 1);

    localStorage.setItem(
      "expenses",
      JSON.stringify(expenses)
    );

    updateApp();
  }

  function updateApp() {
    const now = new Date();

    document.getElementById("todayDate").textContent =
      formatLocalDate(now);

    let todayTotal = 0;
    let monthTotal = 0;

    const monthExpenses = [];

    expenses.forEach((expense, index) => {
      const d = new Date(expense.date);

      const sameMonth =
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth();

      const sameDay =
        sameMonth &&
        d.getDate() === now.getDate();

      if (sameMonth) {
        monthTotal += Number(expense.amount);

        monthExpenses.push({
          ...expense,
          originalIndex: index
        });
      }

      if (sameDay) {
        todayTotal += Number(expense.amount);
      }
    });

    const elapsedDays = now.getDate();

    const dailyAverage =
      elapsedDays > 0
        ? Math.round(monthTotal / elapsedDays)
        : 0;

    document.getElementById("todayTotal").textContent =
      todayTotal;

    document.getElementById("monthTotal").textContent =
      monthTotal;

    document.getElementById("dailyAverage").textContent =
      dailyAverage;

    document.getElementById("remaining").textContent =
      Math.max(6000 - monthTotal, 0);

    renderExpenses(monthExpenses);
  }

  function renderExpenses(monthExpenses) {
    const list =
      document.getElementById("expenseList");

    list.innerHTML = "";

    if (monthExpenses.length === 0) {
      list.innerHTML =
        '<div class="empty">本月還沒有支出紀錄</div>';

      return;
    }

    monthExpenses
      .slice()
      .reverse()
      .forEach(expense => {

        const d = new Date(expense.date);

        const row =
          document.createElement("div");

        row.className = "expense";

        row.innerHTML = `
          <div class="expense-info">
            <div class="expense-item">
              ${expense.item}
            </div>

            <div class="expense-date">
              ${formatLocalDate(d)}
            </div>
          </div>

          <div class="expense-right">
            <div class="expense-amount">
              NT$ ${expense.amount}
            </div>

            <button
              class="delete"
              onclick="deleteExpense(${expense.originalIndex})"
            >
              刪除
            </button>
          </div>
        `;

        list.appendChild(row);
      });
  }

  updateApp();
</script>

</body>
</html>

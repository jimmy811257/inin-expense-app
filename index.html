<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日開銷</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f7;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 20px;
    }

    h1 {
      margin-top: 0;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    button {
      background: black;
      color: white;
      border: none;
      font-weight: bold;
    }

    .summary {
      margin-top: 24px;
      font-size: 18px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="app">
  <h1>每日開銷</h1>

  <select id="item">
    <option>煙錢</option>
    <option>便當</option>
    <option>加油</option>
    <option>其他</option>
  </select>

  <input id="amount" type="number" placeholder="輸入金額">

  <button onclick="saveExpense()">新增支出</button>

  <div class="summary">
    今日支出：NT$ <span id="todayTotal">0</span><br>
    本月累計：NT$ <span id="monthTotal">0</span><br>
    剩餘預算：NT$ <span id="remaining">6000</span>
  </div>
</div>

<script>
  let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

  function saveExpense() {
    const amount = Number(document.getElementById("amount").value);

    if (!amount) return;

    expenses.push({
      item: document.getElementById("item").value,
      amount: amount,
      date: new Date().toISOString()
    });

    localStorage.setItem("expenses", JSON.stringify(expenses));

    document.getElementById("amount").value = "";

    updateSummary();
  }

  function updateSummary() {
    const now = new Date();

    let todayTotal = 0;
    let monthTotal = 0;

    expenses.forEach(expense => {
      const d = new Date(expense.date);

      if (
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth()
      ) {
        monthTotal += expense.amount;

        if (d.getDate() === now.getDate()) {
          todayTotal += expense.amount;
        }
      }
    });

    document.getElementById("todayTotal").textContent = todayTotal;
    document.getElementById("monthTotal").textContent = monthTotal;
    document.getElementById("remaining").textContent =
      Math.max(6000 - monthTotal, 0);
  }

  updateSummary();
</script>

</body>
</html>

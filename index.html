<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>每日開銷</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f7;
      color: #111;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 36px;
    }

    .date {
      margin-bottom: 22px;
      font-size: 17px;
      color: #666;
    }

    .label {
      margin-top: 12px;
      font-size: 15px;
      color: #666;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      font-size: 18px;
      border-radius: 13px;
      border: 1px solid #ccc;
      background: white;
    }

    button {
      background: black;
      color: white;
      border: none;
      font-weight: bold;
    }

    .summary {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #ddd;
      font-size: 18px;
      line-height: 1.9;
    }

    .summary strong {
      font-size: 21px;
    }

    h2 {
      margin-top: 30px;
      font-size: 23px;
    }

    .expense {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .expense-info {
      flex: 1;
    }

    .expense-item {
      font-size: 18px;
      font-weight: 600;
    }

    .expense-date {
      margin-top: 4px;
      color: #777;
      font-size: 14px;
    }

    .expense-right {
      text-align: right;
    }

    .expense-amount {
      font-size: 18px;
      font-weight: 600;
    }

    .delete {
      width: auto;
      margin-top: 6px;
      padding: 6px 10px;
      background: #eee;
      color: #333;
      font-size: 14px;
      border-radius: 8px;
    }

    .empty {
      color: #888;
      padding: 14px 0;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>每日開銷</h1>

  <div class="date" id="todayDate"></div>

  <div

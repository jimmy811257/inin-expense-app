<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>每日開銷</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#f5f5f7;font-family:-apple-system,sans-serif}
.app{max-width:500px;margin:auto;background:#fff;padding:22px;border-radius:22px}
h1{margin:0 0 5px;font-size:34px}
.today{color:#666;margin-bottom:18px}
label{display:block;color:#666;margin-top:10px;font-size:15px}
input,select,button{width:100%;padding:13px;margin:5px 0;font-size:18px;border-radius:12px;border:1px solid #ccc}
button{background:#000;color:#fff;border:0;font-weight:bold}
.budgetBtn{background:#555}
.summary{margin-top:20px;padding-top:15px;border-top:1px solid #ddd;line-height:1.9;font-size:18px}
.summary b{font-size:20px}
h2{margin-top:26px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.item{font-weight:bold;font-size:18px}
.small{color:#777;font-size:14px}
.right{text-align:right}
.del{width:auto;padding:5px 9px;background:#eee;color:#333;font-size:14px}
.empty{color:#888}
</style>
</head>

<body>
<div class="app">

<h1>每日開銷</h1>
<div class="today" id="today"></div>

<label>每月預算</label>
<input id="budget" type="number" inputmode="numeric">
<button class="budgetBtn" onclick="saveBudget()">儲存預算</button>

<label>支出日期</label>
<input id="date" type="date">

<label>支出項目</label>
<select id="item">
<option>煙錢</option>
<option>早餐</option>
<option>便當</option>
<option>晚餐</option>
<option>加油</option>
<option>狗糧</option>
<option>機油／機車維修</option>
<option>咖啡</option>
<option>飲料</option>
<option>零食</option>
<option>速食</option>
<option>日用品</option>
<option>網購</option>
<option>交通</option>
<option>娛樂</option>
<option>醫療</option>
<option>其他</option>
</select>

<label>金額</label>
<input id="amount" type="number" inputmode="numeric" placeholder="輸入金額">

<button onclick="addExpense()">新增支出</button>

<div class="summary">
今日支出：<b>NT$ <span id="todayTotal">0</span></b><br>
本月累計：<b>NT$ <span id="monthTotal">0</span></b><br>
平均每日：<b>NT$ <span id="average">0</span></b><br>
每月預算：<b>NT$ <span id="budgetShow">6000</span></b><br>
剩餘預算：<b>NT$ <span id="remaining">6000</span></b>
</div>

<h2>本月明細</h2>
<div id="list"></div>

</div>

<script>
let expenses=JSON.parse(localStorage.getItem("expenses"))||[];
let monthlyBudget=Number(localStorage.getItem("monthlyBudget"))||6000;

const pad=n=>String(n).padStart(2,"0");

function localDate(d){
 return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function showDate(d){
 return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function saveData(){
 localStorage.setItem("expenses",JSON.stringify(expenses));
}

function saveBudget(){
 const value=Number(document.getElementById("budget").value);

 if(value<=0){
  alert("請輸入正確預算");
  return;
 }

 monthlyBudget=value;
 localStorage.setItem("monthlyBudget",value);
 update();
 alert("預算已儲存");
}

function addExpense(){
 const date=document.getElementById("date").value;
 const item=document.getElementById("item").value;
 const amount=Number(document.getElementById("amount").value);

 if(!date){
  alert("請選擇日期");
  return;
 }

 if(amount<=0){
  alert("請輸入正確金額");
  return;
 }

 expenses.push({
  date:date+"T12:00:00",
  item:item,
  amount:amount
 });

 saveData();
 document.getElementById("amount").value="";
 update();
}

function removeExpense(i){
 if(!confirm("確定刪除這筆支出？"))return;

 expenses.splice(i,1);
 saveData();
 update();
}

function update(){
 const now=new Date();

 let todayTotal=0;
 let monthTotal=0;
 let month=[];

 expenses.forEach((e,i)=>{
  const d=new Date(e.date);

  if(
   d.getFullYear()===now.getFullYear() &&
   d.getMonth()===now.getMonth()
  ){
   monthTotal+=Number(e.amount);
   month.push({...e,index:i});

   if(d.getDate()===now.getDate()){
    todayTotal+=Number(e.amount);
   }
  }
 });

 document.getElementById("todayTotal").textContent=todayTotal;
 document.getElementById("monthTotal").textContent=monthTotal;
 document.getElementById("average").textContent=Math.round(monthTotal/now.getDate());
 document.getElementById("budgetShow").textContent=monthlyBudget;
 document.getElementById("remaining").textContent=monthlyBudget-monthTotal;

 const list=document.getElementById("list");
 list.innerHTML="";

 if(!month.length){
  list.innerHTML='<div class="empty">本月還沒有支出紀錄</div>';
  return;
 }

 month.sort((a,b)=>new Date(b.date)-new Date(a.date));

 month.forEach(e=>{
  const d=new Date(e.date);

  list.innerHTML+=`
   <div class="row">
    <div>
     <div class="item">${e.item}</div>
     <div class="small">${showDate(d)}</div>
    </div>

    <div class="right">
     <div class="item">NT$ ${e.amount}</div>
     <button class="del" onclick="removeExpense(${e.index})">刪除</button>
    </div>
   </div>`;
 });
}

const now=new Date();

document.getElementById("today").textContent=showDate(now);
document.getElementById("date").value=localDate(now);
document.getElementById("budget").value=monthlyBudget;

update();
</script>

</body>
</html>
